# Automação AI-READY: issue do Linear com a label AI-READY vira plano, implementação e PR.
# A consulta ao Linear é um script sem IA (zero tokens quando não há issue); o Claude só roda
# quando existe trabalho. Workflows agendados só rodam a partir da branch padrão (main).
name: AI-READY (Linear)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostrar qual issue seria pega, sem alterar nada"
        type: boolean
        default: false

concurrency:
  group: ai-ready
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.pick.outputs.found }}
      issue_id: ${{ steps.pick.outputs.issue_id }}
      identifier: ${{ steps.pick.outputs.identifier }}
      title: ${{ steps.pick.outputs.title }}
      branch: ${{ steps.pick.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Procurar issue com AI-READY
        id: pick
        run: |
          issue=$(scripts/linear.sh pick)
          if [ -z "$issue" ]; then
            echo "Nenhuma issue com AI-READY."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Issue encontrada: $(jq -r '.identifier + " - " + .title' <<<"$issue")"
          {
            echo "found=true"
            echo "issue_id=$(jq -r .id <<<"$issue")"
            echo "identifier=$(jq -r .identifier <<<"$issue")"
            echo "title=$(jq -r .title <<<"$issue")"
            echo "branch=$(jq -r .branchName <<<"$issue")"
          } >> "$GITHUB_OUTPUT"

      - name: Marcar como em execução
        if: steps.pick.outputs.found == 'true' && !inputs.dry_run
        run: |
          scripts/linear.sh swap-label "${{ steps.pick.outputs.issue_id }}" AI-READY AI-WORKING
          scripts/linear.sh state "${{ steps.pick.outputs.issue_id }}" "In Progress"
          echo "Automação iniciada: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" |
            scripts/linear.sh comment "${{ steps.pick.outputs.issue_id }}"

  implement:
    needs: pick
    if: needs.pick.outputs.found == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ISSUE_ID: ${{ needs.pick.outputs.issue_id }}
      IDENTIFIER: ${{ needs.pick.outputs.identifier }}
      BRANCH: ${{ needs.pick.outputs.branch }}
      ISSUE_FILE: /tmp/ai-ready/issue.md
      NEEDS_INPUT_FILE: /tmp/ai-ready/needs-input.md
      PR_BODY_FILE: /tmp/ai-ready/pr-body.md
      TITLE: ${{ needs.pick.outputs.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar branch da issue
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          mkdir -p /tmp/ai-ready
          scripts/linear.sh get "$ISSUE_ID" > "$ISSUE_FILE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Claude - planejar e implementar
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 200
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,Task,TodoWrite"
          prompt: |
            Você está executando de forma autônoma a issue ${{ needs.pick.outputs.identifier }} do Linear.
            O texto da issue e os comentários estão em ${{ env.ISSUE_FILE }}. Você já está na branch ${{ needs.pick.outputs.branch }}.

            1. Leia CLAUDE.md e docs/decisions.md (as decisões prevalecem).
            2. Siga .claude/skills/tlc-plan/SKILL.md para escrever a task em .tasks/<nome>.md e faça commit.
            3. Siga .claude/skills/tlc-implement/SKILL.md: checklist em .checks/<nome>.md, implementação,
               provas rodando de verdade (mvn test com o JDK 21 já instalado; npm em frontend/) e verificação
               independente por subagente. Perfil light, handoff off.
            4. Commits em PT-BR, Conventional Commits, com a linha "Refs: ${{ needs.pick.outputs.identifier }}".
               Não faça push nem abra PR: o workflow faz isso.

            Ninguém vai responder perguntas durante a execução. Se faltar uma decisão que impeça escrever
            critérios com valores concretos, ou se a task ficar com algum Unresolved de Kind `blocks`, NÃO escreva
            código: escreva no máximo 3 perguntas, cada uma com opções e a sua recomendação, em
            ${{ env.NEEDS_INPUT_FILE }} e termine. Pontos `open` seguem com o padrão recomendado.

            Ao terminar com sucesso, escreva em ${{ env.PR_BODY_FILE }}, em PT-BR: o que mudou, o veredito do
            verificador (checks provados / total) e os pontos `open` que você assumiu.

      - name: Verificar resultado
        id: result
        run: |
          if [ -f "$NEEDS_INPUT_FILE" ]; then echo "needs_input=true" >> "$GITHUB_OUTPUT"; else echo "needs_input=false" >> "$GITHUB_OUTPUT"; fi

      - name: Parou com perguntas
        if: steps.result.outputs.needs_input == 'true'
        run: |
          git push -u origin "$BRANCH" || true
          { echo "**A automação parou e precisa de respostas:**"; echo; cat "$NEEDS_INPUT_FILE"; echo;
            echo "Responda aqui nos comentários e recoloque a label AI-READY."; } |
            scripts/linear.sh comment "$ISSUE_ID"
          scripts/linear.sh swap-label "$ISSUE_ID" AI-WORKING AI-NEEDS-INPUT

      - name: Abrir PR
        if: steps.result.outputs.needs_input == 'false'
        run: |
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "Nenhum commit novo na branch." >&2
            exit 1
          fi
          git push -u origin "$BRANCH"
          [ -f "$PR_BODY_FILE" ] || echo "Implementação automática da issue $IDENTIFIER." > "$PR_BODY_FILE"
          printf '\n\nRefs: %s\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' "$IDENTIFIER" >> "$PR_BODY_FILE"
          url=$(gh pr list --head "$BRANCH" --json url -q '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$BRANCH" \
              --title "$IDENTIFIER: $TITLE" --body-file "$PR_BODY_FILE")
          fi
          echo "**PR aberto:** $url" | scripts/linear.sh comment "$ISSUE_ID"
          scripts/linear.sh swap-label "$ISSUE_ID" AI-WORKING AI-DONE

      - name: Registrar falha
        if: failure()
        run: |
          echo "**A automação falhou.** Veja o log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" |
            scripts/linear.sh comment "$ISSUE_ID"
          scripts/linear.sh swap-label "$ISSUE_ID" AI-WORKING AI-NEEDS-INPUT
