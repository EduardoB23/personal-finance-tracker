# Banco em memória para os testes: nunca tocar no banco real em ./data/finance.
# Na mesma pasta do classpath, .properties tem precedência sobre .yml, então só a URL
# é sobrescrita e o restante do application.yml principal continua valendo.
spring.datasource.url=jdbc:h2:mem:finance-test;DB_CLOSE_DELAY=-1

# PIN de teste: 2468. O hash foi gerado com --gerar-hash-pin=2468; os testes não dependem de FINANCE_PIN_HASH.
finance.pin-hash=$2a$10$L1bVrQO/V45qhiVmwQgVweOW2Jv0gM6B4W4HsoIpQ5K9SskSByNrq

# Backup automático de teste: nunca no OneDrive do usuário (poda os arquivos antigos da pasta)
finance.backup-dir=target/test-backups
