server:
  port: 8080

spring:
  application:
    name: personal-finance-tracker
  datasource:
    url: jdbc:h2:file:./data/finance;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

finance:
  # Hash BCrypt do PIN familiar, definido fora do código (D6). Gere com --gerar-hash-pin=<pin>.
  pin-hash: ${FINANCE_PIN_HASH:}
